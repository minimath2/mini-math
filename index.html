    async function hashSHA256(plainText) {
      const encoder = new TextEncoder();
      const data = encoder.encode(plainText);
      const hashBuffer = await window.crypto.subtle.digest('SHA-256', data);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map((b) => b.toString(16).padStart(2, '0')).join('');
    }

    const memoryStorageFallback = {};

    const safeStorage = {
      get(key) {
        try {
          return window.localStorage.getItem(key);
        } catch {
          return memoryStorageFallback[key] ?? null;
        }
      },
      set(key, value) {
        try {
          window.localStorage.setItem(key, value);
        } catch {
          memoryStorageFallback[key] = value;
        }
      },
      remove(key) {
        try {
          window.localStorage.removeItem(key);
        } catch {
          delete memoryStorageFallback[key];
        }
      },
    };

    function toTitleCase(str) {
      return str
        .trim()
        .replace(/\s+/g, ' ')
        .split(' ')
        .map((word) =>
          word.length > 0 ? word[0].toUpperCase() + word.slice(1).toLowerCase() : ''
        )
        .join(' ');
    }

    function normalizeName(str) {
      return str.trim().replace(/\s+/g, ' ').toLowerCase();

    function formatStopwatch(totalSeconds) {
      const mins = Math.floor(totalSeconds / 60);
      const secs = totalSeconds % 60;
      return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    function formatTimestampID(isoString) {
      if (!isoString) return '-';
      try {
        const date = new Date(isoString);
        return new Intl.DateTimeFormat('id-ID', {
          day: '2-digit',
          month: 'short',
          year: 'numeric',
          hour: '2-digit',
          minute: '2-digit',
        }).format(date);
      } catch {
        return isoString;
      }
    }

    /**
     * Mengunduh file index.html bersih langsung dari browser
     */
    function triggerDownloadStandaloneHTML() {
      const clone = document.documentElement.cloneNode(true);
      const rootEl = clone.querySelector('#root');
      if (rootEl) rootEl.innerHTML = '';

      // Bersihkan script module hasil kompilasi sementara Babel agar tidak terduplikasi
      clone.querySelectorAll('script[type="module"]').forEach((sc) => {
        if (!sc.getAttribute('src')) sc.remove();
      });

      const htmlString = '<!DOCTYPE html>\n' + clone.outerHTML;
      const blob = new Blob([htmlString], { type: 'text/html;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.setAttribute('download', 'index.html');
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }

    function MatrixBlock({ rows }) {

      return (
        <span
          className="inline-flex items-stretch align-middle mx-1.5 my-1 select-none"

            />
          </svg>

          <span
            className={`grid ${

            } gap-y-0.5 px-1 py-0.5 text-[0.9em] sm:text-[0.95em] font-medium leading-tight tabular-nums text-right`}
          >
            {rows.flatMap((row, rIdx) =>

                <span key={`${rIdx}-${cIdx}`} className="inline-block min-w-[1.35rem]">
                  {cell}
                </span>
              ))
            )}
          </span>

          <svg
            className="w-[7px] sm:w-[8px] self-stretch shrink-0 text-current"
            viewBox="0 0 10 44"
            preserveAspectRatio="none"
            aria-hidden="true"
          >

              d="M 1.5 1.5 C 7.5 9, 7.5 35, 1.5 42.5"
              fill="none"
              stroke="currentColor"
              strokeWidth="1.65"
              strokeLinecap="round"
              vectorEffect="non-scaling-stroke"
            />
          </svg>
        </span>
      );
    }

    function MathText({ text, className = '' }) {
      if (!text) return null;
      const tokens = text.split(/(\[\[(?:mat|vec):[^\]]+\]\]|\$[^$]+\$)/g);

      return (
        <span className={`leading-relaxed ${className}`}>
          {tokens.map((token, idx) => {
            if (!token) return null;

            if (token.startsWith('[[mat:') && token.endsWith(']]')) {
              const inner = token.slice(6, -2);
              const rows = inner.split(';').map((r) => r.split(',').map((v) => v.trim()));
              return <MatrixBlock key={idx} rows={rows} />;
            }

            if (token.startsWith('[[vec:') && token.endsWith(']]')) {
              const inner = token.slice(6, -2);
              const rows = inner.split(';').map((v) => [v.trim()]);
              return <MatrixBlock key={idx} rows={rows} />;
            }

            if (token.startsWith('$') && token.endsWith('$')) {
              const expr = token.slice(1, -1);
              return (
                <span
                  key={idx}
                  className="font-semibold tracking-tight px-0.5"
                  style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: '0.93em' }}
                >
                  {expr}
                </span>
              );
            }

            return <React.Fragment key={idx}>{token}</React.Fragment>;
          })}
        </span>
      );
    }

          try {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
              await signInWithCustomToken(auth, __initial_auth_token);

            }
          } catch {
            if (isMounted) {
              setDbError('Gagal terhubung ke layanan autentikasi cloud.');
            }
          }
        };

        initAuth();

        const unsubscribe = onAuthStateChanged(auth, (user) => {
          if (isMounted) {
            setFirebaseUser(user);
            setAuthReady(true);
          }
        });

        return () => {
          isMounted = false;
          unsubscribe();
        };
      }, []);

      useEffect(() => {
        if (!firebaseUser || !db) return;

        const ensureAdminSettings = async () => {
          try {
            const adminDocRef = getAdminSettingsDocRef();
            const snap = await getDoc(adminDocRef);
            if (!snap.exists()) {
              const initialHash = await hashSHA256(APP_CONFIG.defaultAdminPasswordSeed);
              await setDoc(adminDocRef, {
                passwordHash: initialHash,
                updatedAt: new Date().toISOString(),

            }

        ensureAdminSettings();

            setLoadingResults(false);

            if ((a.durationSeconds ?? 999999) !== (b.durationSeconds ?? 999999)) {

          let correctCount = 0;

              topic: q.topic,

    function LoginView({
      palette,
      authReady,
      firebaseUser,
      results,
      localSession,
      onStartQuiz,
      onGoLeaderboard,
    }) {
      const [fullName, setFullName] = useState('');
      const [selectedClass, setSelectedClass] = useState(APP_CONFIG.classes[0]);
      const [formError, setFormError] = useState('');
      const [isCheckingCloud, setIsCheckingCloud] = useState(false);
      const [lockedRecord, setLockedRecord] = useState(null);

      const effectiveLockedRecord = useMemo(() => {
        if (lockedRecord) return lockedRecord;
        if (localSession?.completed) return localSession;
        return null;
      }, [lockedRecord, localSession]);

      const handleSubmit = async (e) => {
        e.preventDefault();
        setFormError('');

        const formattedName = toTitleCase(fullName);
        const normName = normalizeName(fullName);

        if (normName.length < 3) {
          setFormError('Masukkan nama lengkap minimal 3 karakter.');
          return;
        }

        if (localSession?.completed) {
          setLockedRecord(localSession);
          return;
        }

        setIsCheckingCloud(true);
        try {
          let existingMatch = results.find(
            (r) => r.normalizedName === normName && r.className === selectedClass
          );

          if (!existingMatch && db && firebaseUser) {
            const snap = await getDocs(getResultsCollectionRef());
            snap.forEach((docSnap) => {
              const data = docSnap.data();
              if (data.normalizedName === normName && data.className === selectedClass) {
                existingMatch = { id: docSnap.id, ...data };
              }
            });
          }

          if (existingMatch) {
            const lockObj = {
              completed: true,
              ...existingMatch,
            };
            safeStorage.set(APP_CONFIG.storageKeys.session, JSON.stringify(lockObj));
            setLockedRecord(lockObj);
            return;
          }

          onStartQuiz({
            fullName: formattedName,
            normalizedName: normName,
            className: selectedClass,
          });
        } catch {
          setFormError('Gagal memverifikasi data ke server. Periksa koneksi internet Anda.');
        } finally {
          setIsCheckingCloud(false);
        }
      };

      return (
        <div className="max-w-xl mx-auto">
          <div className="mb-6">
            <div
              className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded text-xs font-semibold border mb-3"
              style={{
                borderColor: palette.border,
                backgroundColor: palette.surface,
                color: palette.textSecondary,
              }}
            >
              <BookOpen className="w-3.5 h-3.5" style={{ color: palette.accent }} />
              <span>Matematika Lanjut • Kelas XI SMA</span>
            </div>
            <h1 className="text-2xl sm:text-3xl font-extrabold tracking-tight leading-tight">
              Kuis Interaktif Transformasi Matriks
            </h1>
            <p className="text-sm sm:text-base mt-2 leading-relaxed" style={{ color: palette.textSecondary }}>
              Uji pemahaman Anda mengenai translasi, refleksi, rotasi, dilatasi, dan komposisi
              transformasi matriks. Terdiri dari <strong>5 soal pilihan ganda</strong> dengan sistem
              penilaian otomatis.
            </p>
          </div>

          {effectiveLockedRecord ? (
            <div
              className="rounded-lg border p-5 sm:p-6"
              style={{
                backgroundColor: palette.surface,
                borderColor: palette.border,
              }}
            >
              <div className="flex items-start gap-3">
                <div
                  className="p-2.5 rounded-md shrink-0"
                  style={{
                    backgroundColor: palette.correctSoft,
                    color: palette.correct,
                  }}
                >
                  <UserCheck className="w-5 h-5" />
                </div>
                <div>
                  <span
                    className="text-xs font-bold uppercase tracking-wider"
                    style={{ color: palette.correct }}
                  >
                    Status: Kuis Telah Diselesaikan
                  </span>
                  <h2 className="text-lg sm:text-xl font-bold mt-0.5">
                    {effectiveLockedRecord.fullName} ({effectiveLockedRecord.className})
                  </h2>
                  <p className="text-xs sm:text-sm mt-1" style={{ color: palette.textSecondary }}>
                    Sistem mendeteksi bahwa Anda sudah menyelesaikan kuis ini. Setiap peserta hanya
                    memiliki <strong>1 kali kesempatan</strong> mengerjakan.
                  </p>
                </div>
              </div>

              <div
                className="grid grid-cols-2 gap-3 mt-5 p-4 rounded-md border"
                style={{
                  backgroundColor: palette.surfaceSubtle,
                  borderColor: palette.border,
                }}
              >
                <div>
                  <div className="text-xs font-medium" style={{ color: palette.textSecondary }}>
                    Skor Akhir Anda
                  </div>
                  <div
                    className="text-2xl sm:text-3xl font-extrabold mt-0.5 tabular-nums"
                    style={{
                      color: palette.accent,
                      fontFamily: "'JetBrains Mono', monospace",
                    }}
                  >
                    {effectiveLockedRecord.score}
                    <span className="text-sm font-normal" style={{ color: palette.textSecondary }}>
                      /100
                    </span>
                  </div>
                </div>
                <div>
                  <div className="text-xs font-medium" style={{ color: palette.textSecondary }}>
                    Waktu Pengerjaan
                  </div>
                  <div
                    className="text-2xl sm:text-3xl font-extrabold mt-0.5 tabular-nums"
                    style={{ fontFamily: "'JetBrains Mono', monospace" }}
                  >
                    {effectiveLockedRecord.durationSeconds}
                    <span className="text-sm font-normal ml-1" style={{ color: palette.textSecondary }}>
                      detik
                    </span>
                  </div>
                </div>
              </div>

              <button
                type="button"
                onClick={onGoLeaderboard}
                className="mt-5 w-full min-h-[48px] px-4 py-3 rounded-md font-bold text-sm text-white flex items-center justify-center gap-2 transition-colors"
                style={{ backgroundColor: palette.accent }}

                <span>Lihat Papan Peringkat & Rincian Jawaban</span>
                <ArrowRight className="w-4 h-4" />
              </button>
            </div>
          ) : (
            <form
              onSubmit={handleSubmit}
              className="rounded-lg border p-5 sm:p-6"
              style={{
                backgroundColor: palette.surface,
                borderColor: palette.border,
              }}
            >
              <h2 className="text-base sm:text-lg font-bold mb-4">Identitas Peserta Kuis</h2>

              {formError && (
                <div
                  className="mb-4 p-3 rounded-md border text-xs sm:text-sm font-medium flex items-center gap-2"
                  style={{
                    backgroundColor: palette.incorrectSoft,
                    borderColor: palette.incorrect,
                    color: palette.incorrect,
                  }}
                >
                  <AlertTriangle className="w-4 h-4 shrink-0" />
                  <span>{formError}</span>
                </div>
              )}

              <div className="space-y-4">
                <div>
                  <label
                    htmlFor="student-name"
                    className="block text-sm font-semibold mb-1.5"
                  >
                    Nama Lengkap <span style={{ color: palette.incorrect }}>*</span>
                  </label>
                  <input
                    id="student-name"
                    type="text"
                    required
                    value={fullName}
                    onChange={(e) => setFullName(e.target.value)}
                    onBlur={() => {
                      if (fullName.trim()) setFullName(toTitleCase(fullName));
                    }}
                    placeholder="Contoh: Ahmad Fauzan"
                    autoComplete="name"
                    className="w-full min-h-[48px] px-3.5 py-2.5 rounded-md border text-base outline-none transition-colors"
                    style={{
                      backgroundColor: palette.bg,
                      borderColor: palette.border,
                      color: palette.textPrimary,
                      fontSize: '16px',
                    }}
                  />
                  <p className="text-xs mt-1" style={{ color: palette.textSecondary }}>
                    Gunakan nama lengkap sesuai absensi kelas.
                  </p>
                </div>

                <div>
                  <label
                    htmlFor="student-class"
                    className="block text-sm font-semibold mb-1.5"
                  >
                    Kelas <span style={{ color: palette.incorrect }}>*</span>
                  </label>
                  <select
                    id="student-class"
                    value={selectedClass}
                    onChange={(e) => setSelectedClass(e.target.value)}
                    className="w-full min-h-[48px] px-3.5 py-2.5 rounded-md border text-base outline-none transition-colors"
                    style={{
                      backgroundColor: palette.bg,
                      borderColor: palette.border,
                      color: palette.textPrimary,
                      fontSize: '16px',
                    }}
                  >
                    {APP_CONFIG.classes.map((cls) => (
                      <option key={cls} value={cls}>
                        {cls}
                      </option>
                    ))}
                  </select>
                </div>
              </div>

              <div
                className="mt-5 p-3.5 rounded-md border text-xs space-y-1.5"
                style={{
                  backgroundColor: palette.surfaceSubtle,
                  borderColor: palette.border,
                  color: palette.textSecondary,
                }}
              >
                <div className="font-bold" style={{ color: palette.textPrimary }}>
                  Ketentuan Pengerjaan:
                </div>
                <div>• Setiap siswa hanya diperbolehkan mengerjakan 1 kali.</div>
                <div>• Waktu pengerjaan dihitung sebagai penentu peringkat jika skor sama.</div>
                <div>• Pastikan koneksi internet stabil saat mengumpulkan jawaban.</div>
              </div>

              <button
                type="submit"
                disabled={!authReady || isCheckingCloud}
                className="mt-5 w-full min-h-[48px] px-4 py-3 rounded-md font-bold text-sm sm:text-base text-white flex items-center justify-center gap-2 transition-colors disabled:opacity-60"
                style={{ backgroundColor: palette.accent }}
              >
                {isCheckingCloud ? (
                  <>
                    <RefreshCw className="w-4 h-4 animate-spin" />
                    <span>Memverifikasi Peserta...</span>
                  </>
                ) : (
                  <>
                    <span>Mulai Mengerjakan</span>
                    <ArrowRight className="w-4 h-4" />
                  </>
                )}
              </button>
            </form>
          )}
        </div>
      );
    }

    // ============================================================================
    // 9. PANEL ADMIN TERPROTEKSI & UBAH SANDI SHA-256
    // ============================================================================

    function AdminView({
      palette,
      firebaseUser,
      isAuthenticated,
      onLoginSuccess,
      onLogout,
      rankedResults,
      onDeleteParticipant,
      localSession,
      onClearLocalLock,
      customAdminHash,
      setCustomAdminHash,
    }) {
      const [passwordInput, setPasswordInput] = useState('');
      const [loginError, setLoginError] = useState('');
      const [isVerifying, setIsVerifying] = useState(false);

      const [classFilter, setClassFilter] = useState('ALL');
      const [searchQuery, setSearchQuery] = useState('');
      const [deleteTarget, setDeleteTarget] = useState(null);
      const [isDeleting, setIsDeleting] = useState(false);

      const [showSecurityPanel, setShowSecurityPanel] = useState(false);
      const [currentPwd, setCurrentPwd] = useState('');
      const [newPwd, setNewPwd] = useState('');
      const [confirmPwd, setConfirmPwd] = useState('');
      const [pwdFeedback, setPwdFeedback] = useState(null);
      const [isUpdatingPwd, setIsUpdatingPwd] = useState(false);

      const handleAdminLogin = async (e) => {
        e.preventDefault();
        setLoginError('');
        if (!passwordInput) return;

        setIsVerifying(true);
        try {
          const inputHash = await hashSHA256(passwordInput);

          if (db && firebaseUser) {
            const docRef = getAdminSettingsDocRef();
            const snap = await getDoc(docRef);
            if (snap.exists()) {
              const storedHash = snap.data().passwordHash;
              if (inputHash === storedHash) {
                setPasswordInput('');
                onLoginSuccess();
                return;
              } else {
                setLoginError('Sandi admin tidak sesuai.');
                return;
              }
            }
          }

          const fallbackHash =
            customAdminHash || (await hashSHA256(APP_CONFIG.defaultAdminPasswordSeed));
          if (inputHash === fallbackHash) {
            setPasswordInput('');
            onLoginSuccess();
          } else {
            setLoginError('Sandi admin tidak sesuai.');
          }
        } catch {
          setLoginError('Gagal memverifikasi sandi ke database.');
        } finally {
          setIsVerifying(false);
        }
      };

      const handleChangeAdminPassword = async (e) => {
        e.preventDefault();
        setPwdFeedback(null);

        if (newPwd.length < 6) {
          setPwdFeedback({
            type: 'error',
            message: 'Sandi baru minimal harus terdiri dari 6 karakter.',
          });
          return;
        }

        if (newPwd !== confirmPwd) {
          setPwdFeedback({
            type: 'error',
            message: 'Konfirmasi sandi baru tidak cocok.',
          });
          return;
        }

        setIsUpdatingPwd(true);
        try {
          const currentInputHash = await hashSHA256(currentPwd);
          const defaultHash = await hashSHA256(APP_CONFIG.defaultAdminPasswordSeed);

          if (db && firebaseUser) {
            const docRef = getAdminSettingsDocRef();
            const snap = await getDoc(docRef);
            const expectedHash = snap.exists() ? snap.data().passwordHash : defaultHash;

            if (currentInputHash !== expectedHash) {
              setPwdFeedback({
                type: 'error',
                message: 'Sandi saat ini salah. Perubahan dibatalkan.',
              });
              return;
            }

            const newHash = await hashSHA256(newPwd);
            await setDoc(docRef, {
              passwordHash: newHash,
              updatedAt: new Date().toISOString(),
            });
          } else {
            const expectedHash = customAdminHash || defaultHash;
            if (currentInputHash !== expectedHash) {
              setPwdFeedback({
                type: 'error',
                message: 'Sandi saat ini salah. Perubahan dibatalkan.',
              });
              return;
            }
            const newHash = await hashSHA256(newPwd);
            setCustomAdminHash(newHash);
          }

          setCurrentPwd('');
          setNewPwd('');
          setConfirmPwd('');
          setPwdFeedback({
            type: 'success',
            message: 'Sandi admin berhasil diperbarui.',
          });
        } catch {
          setPwdFeedback({
            type: 'error',
            message: 'Terjadi kesalahan saat menyimpan sandi baru.',
          });
        } finally {
          setIsUpdatingPwd(false);
        }
      };

      const stats = useMemo(() => {
        const total = rankedResults.length;
        if (total === 0) {
          return {
            total: 0,
            avgScore: '0.0',
            highestScore: 0,
            passRate: 0,
          };
        }
        const sum = rankedResults.reduce((acc, r) => acc + (r.score ?? 0), 0);
        const highest = Math.max(...rankedResults.map((r) => r.score ?? 0));
        const passed = rankedResults.filter((r) => (r.score ?? 0) >= APP_CONFIG.passingScore).length;

        return {
          total,
          avgScore: (sum / total).toFixed(1),
          highestScore: highest,
          passRate: Math.round((passed / total) * 100),
        };
      }, [rankedResults]);

      const filteredResults = useMemo(() => {
        const q = searchQuery.trim().toLowerCase();
        return rankedResults.filter((item) => {
          const matchClass = classFilter === 'ALL' || item.className === classFilter;
          const matchName = !q || (item.fullName || '').toLowerCase().includes(q);
          return matchClass && matchName;
        });
      }, [rankedResults, classFilter, searchQuery]);

      const handleExportCSV = () => {
        const headers = [
          'Peringkat',

          'Kelas',
          'Skor',
          'Waktu (Detik)',
          'Waktu Submit',
          'No 1',
          'No 2',
          'No 3',
          'No 4',
          'No 5',
        ];

        const rows = filteredResults.map((item) => {
          const ansCols = QUESTIONS_BANK.map((q) => {
            const found = (item.answers || []).find((a) => a.questionId === q.id);
            if (!found || !found.selectedOption) return '-';
            return `${found.selectedOption} (${found.isCorrect ? 'Benar' : 'Salah'})`;

            item.rank,

            item.score,
            item.durationSeconds,
            `"${formatTimestampID(item.submittedAt)}"`,
            ...ansCols,

        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });

        link.click();

        URL.revokeObjectURL(url);

    function DeployGuideModal({ palette, onClose }) {
      const [copiedKey, setCopiedKey] = useState(null);

      const copySnippet = (key, text) => {
        const textArea = document.createElement('textarea');
        textArea.value = text;
        textArea.style.position = 'fixed';
        textArea.style.left = '-9999px';
        document.body.appendChild(textArea);
        textArea.select();
        try {
          document.execCommand('copy');
        } catch {
          navigator.clipboard?.writeText(text);
        }
        document.body.removeChild(textArea);
        setCopiedKey(key);
        setTimeout(() => setCopiedKey(null), 2000);
      };

      const firestoreRulesCode = `rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    match /artifacts/{appId}/public/data/results/{resultId} {
      allow read: if true;
      allow create: if request.resource.data.keys().hasAll([
        'fullName', 'normalizedName', 'className', 'score', 'durationSeconds', 'answers'
      ]) && request.resource.data.score >= 0 && request.resource.data.score <= 100;
      allow update: if false;
      allow delete: if request.auth != null;
    }

    match /artifacts/{appId}/public/data/settings/admin {
      allow read: if true;
      allow create: if !exists(/databases/$(database)/documents/artifacts/$(appId)/public/data/settings/admin)
                    && request.resource.data.passwordHash is string;
      allow update: if request.resource.data.passwordHash is string
                    && request.resource.data.passwordHash.size() == 64;
      allow delete: if false;
    }
  }
}`;
